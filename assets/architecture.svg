<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
 <title id="title">弦触云声系统架构</title><desc id="desc">FSR与摇杆经ADC接入FPGA，实时合成音频和显示，ESP32-S3连接OLED与微信小程序。</desc>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#594090"/></marker></defs>
 <rect width="1120" height="460" rx="16" fill="#f8f7fb"/>
 <g font-family="sans-serif" fill="#262333"><text x="34" y="43" font-size="23" font-weight="700">弦触 · 云声</text><text x="34" y="70" font-size="14" fill="#686275">压力与手势 → 实时合成 → 声音与视图</text></g>
 <g stroke="#c6bfda" fill="white" stroke-width="1.5"><rect x="34" y="125" width="173" height="120" rx="8"/><rect x="247" y="144" width="128" height="82" rx="8"/><rect x="422" y="105" width="316" height="202" rx="8" stroke="#594090" stroke-width="2"/><rect x="797" y="116" width="286" height="80" rx="8"/><rect x="797" y="229" width="286" height="78" rx="8"/><rect x="422" y="353" width="171" height="72" rx="8"/><rect x="34" y="353" width="291" height="72" rx="8"/><rect x="797" y="353" width="286" height="72" rx="8"/></g>
 <g font-family="sans-serif" text-anchor="middle" fill="#262333"><text x="120" y="160" font-size="18" font-weight="700">4 FSR · 双摇杆</text><text x="120" y="191" font-size="14">力度 / 四个模拟轴</text><text x="120" y="217" font-size="14">Z 按键 / LED 指引</text><text x="311" y="177" font-size="18">MCP3208</text><text x="311" y="201" font-size="13">8 路 / 12 位</text><text x="580" y="142" font-size="23" font-weight="700">Tang Mega 60K</text><text x="580" y="177" font-size="16">四声部分配 · 音高 · ADSR</text><text x="580" y="208" font-size="16">加法分量 · 合唱 / 空间混响</text><text x="580" y="239" font-size="16">曲谱执行 · FFT · 视频生成</text><text x="580" y="277" font-size="13" fill="#594090">音频运算在 FPGA 内完成</text><text x="940" y="148" font-size="18">PT8211 → 音箱</text><text x="940" y="175" font-size="13">右对齐串行 DAC / 模拟音频</text><text x="940" y="260" font-size="18">HDMI → 显示器</text><text x="940" y="287" font-size="13">数字波形 / 频谱 / XY</text><text x="507" y="384" font-size="18">ESP32-S3</text><text x="507" y="409" font-size="13">BLE ↔ UART 桥接</text><text x="179" y="384" font-size="18">微信小程序 ↔ 曲库服务</text><text x="179" y="409" font-size="13">选曲 / 自定义 / 设备状态</text><text x="940" y="384" font-size="18">中文 OLED</text><text x="940" y="409" font-size="13">模式 / 音色 / 音组 / 手势</text></g>
